<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Student Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <!-- LEFT SIDE — form -->
  <div id="login-left">
    <div id="login-container">

      <div id="login-logo">
        <span>SM</span>
      </div>

      <h2>Welcome Back</h2>
      <p>Sign in with your school account</p>

      <div class="input-group">
        <label>EMAIL</label>
        <input type="email" id="usernameInput" placeholder="admin@school.com">
      </div>

      <div class="input-group">
        <label>PASSWORD</label>
        <input type="password" id="passwordInput" placeholder="••••••••••">
      </div>

      <button id="loginBtn">LOGIN</button>
      <p id="loginError"></p>

      <p id="login-hint">Contact your administrator if you need access</p>

    </div>
  </div>

  <!-- RIGHT SIDE — gradient with text -->
  <div id="login-right">
    <div id="login-right-content">
      <h1>Welcome to<br>Student Manager</h1>
      <div id="login-divider"></div>
      <p>Login to Access Dashboard</p>
    </div>
  </div>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
