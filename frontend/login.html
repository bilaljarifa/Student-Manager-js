<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Student Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ═══════════════════════════════════════════════════════════════════
       MODERN LOGIN PAGE (Full Screen)
       ═══════════════════════════════════════════════════════════════════ */

    .login-page {
      margin: 0;
      padding: 0;
      display: flex;
      min-height: 100vh;
      background: linear-gradient(135deg, #F8FAFC 0%, #FFFFFF 100%);
    }

    /* ─────────────────────────────────────────────────────────────────
       LEFT SIDE: LOGIN FORM
       ───────────────────────────────────────────────────────────────── */
    #login-left {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      background: white;
      box-shadow: -4px 0 16px rgba(0, 0, 0, 0.04);
    }

    #login-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* LOGO */
    #login-logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 8px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    #login-logo span {
      color: white;
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: 1px;
    }

    /* HEADINGS */
    #login-container h2 {
      font-size: 2rem;
      font-weight: 800;
      color: #1E293B;
      margin: 0;
      letter-spacing: -0.5px;
    }

    #login-container > p {
      color: #64748B;
      font-size: 1rem;
      margin: 0;
      font-weight: 500;
    }

    /* INPUT GROUP */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .input-group label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #475569;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .input-group input {
      padding: 14px 16px;
      border: 1.5px solid #E2E8F0;
      border-radius: 10px;
      font-size: 0.95rem;
      color: #1E293B;
      background: #F8FAFC;
      outline: none;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
    }

    .input-group input::placeholder {
      color: #94A3B8;
    }

    .input-group input:focus {
      border-color: #4F46E5;
      background: white;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .input-group input.error {
      border-color: #EF4444;
      background: rgba(239, 68, 68, 0.05);
      box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
    }

    /* LOGIN BUTTON */
    #loginBtn {
      padding: 14px 16px;
      background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 8px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      text-transform: uppercase;
    }

    #loginBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
    }

    #loginBtn:active:not(:disabled) {
      transform: translateY(0);
    }

    #loginBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ERROR MESSAGE */
    #loginError {
      text-align: center;
      font-size: 0.85rem;
      color: #EF4444;
      min-height: 20px;
      margin: 0;
      font-weight: 600;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* HINT TEXT */
    #login-hint {
      text-align: center;
      font-size: 0.8rem;
      color: #94A3B8;
      margin: 0;
      font-weight: 500;
      padding-top: 8px;
      border-top: 1px solid #E2E8F0;
    }

    /* ─────────────────────────────────────────────────────────────────
       RIGHT SIDE: GRADIENT BACKGROUND WITH TEXT
       ───────────────────────────────────────────────────────────────── */
    #login-right {
      flex: 1;
      background: linear-gradient(135deg, #4F46E5 0%, #6366F1 50%, #8B5CF6 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 40px;
      position: relative;
      overflow: hidden;
    }

    /* Decorative circles */
    #login-right::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      top: -150px;
      right: -150px;
      animation: float 8s ease-in-out infinite;
    }

    #login-right::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      bottom: -100px;
      left: -100px;
      animation: float 10s ease-in-out infinite 1s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(20px);
      }
    }

    #login-right-content {
      color: white;
      text-align: center;
      position: relative;
      z-index: 10;
      animation: fadeInUp 0.8s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #login-right-content h1 {
      font-size: 2.8rem;
      font-weight: 800;
      margin: 0 0 20px 0;
      line-height: 1.2;
      letter-spacing: -1px;
    }

    #login-divider {
      width: 60px;
      height: 4px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0));
      margin: 0 auto 24px;
      border-radius: 2px;
    }

    #login-right-content p {
      font-size: 1.1rem;
      opacity: 0.95;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin: 0;
    }

    /* ═══════════════════════════════════════════════════════════════════
       DEMO CREDENTIALS HINT (optional)
       ═══════════════════════════════════════════════════════════════════ */
    .demo-hint {
      background: #FEF3C7;
      border: 1px solid #FCD34D;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.85rem;
      color: #78350F;
      margin-top: 8px;
      text-align: center;
    }

    .demo-hint strong {
      display: block;
      font-weight: 700;
      margin-bottom: 4px;
    }

    /* ═══════════════════════════════════════════════════════════════════
       RESPONSIVE DESIGN
       ═══════════════════════════════════════════════════════════════════ */

    @media (max-width: 1024px) {
      #login-left {
        padding: 30px 20px;
      }

      #login-right {
        padding: 40px 30px;
      }

      #login-right-content h1 {
        font-size: 2.2rem;
      }
    }

    @media (max-width: 768px) {
      .login-page {
        flex-direction: column-reverse;
      }

      #login-right {
        min-height: 300px;
        padding: 40px 20px;
        justify-content: center;
      }

      #login-right::before {
        width: 300px;
        height: 300px;
      }

      #login-right::after {
        width: 200px;
        height: 200px;
      }

      #login-right-content h1 {
        font-size: 2rem;
        margin-bottom: 16px;
      }

      #login-right-content p {
        font-size: 1rem;
      }

      #login-left {
        padding: 40px 20px;
        min-height: auto;
      }

      #login-container {
        max-width: 100%;
      }

      #login-container h2 {
        font-size: 1.8rem;
      }

      #login-container > p {
        font-size: 0.95rem;
      }

      #loginBtn {
        padding: 12px 16px;
        font-size: 0.9rem;
      }
    }

    @media (max-width: 480px) {
      #login-left {
        padding: 24px 16px;
      }

      #login-logo {
        width: 48px;
        height: 48px;
      }

      #login-logo span {
        font-size: 1.2rem;
      }

      #login-container {
        gap: 16px;
      }

      #login-container h2 {
        font-size: 1.5rem;
      }

      #login-container > p {
        font-size: 0.9rem;
      }

      .input-group input {
        padding: 12px 14px;
        font-size: 0.9rem;
      }

      #loginBtn {
        padding: 12px 14px;
        font-size: 0.85rem;
      }

      #login-right {
        min-height: 250px;
        padding: 30px 16px;
      }

      #login-right::before {
        width: 250px;
        height: 250px;
        top: -100px;
        right: -100px;
      }

      #login-right::after {
        width: 150px;
        height: 150px;
      }

      #login-right-content h1 {
        font-size: 1.5rem;
        margin-bottom: 12px;
      }

      #login-divider {
        width: 40px;
        margin-bottom: 12px;
      }

      #login-right-content p {
        font-size: 0.9rem;
      }

      #login-hint {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body class="login-page">

  <!-- LEFT SIDE — LOGIN FORM -->
  <div id="login-left">
    <div id="login-container">

      <!-- LOGO -->
      <div id="login-logo">
        <span>SM</span>
      </div>

      <!-- HEADING -->
      <h2>Welcome Back</h2>
      <p>Sign in with your school account</p>

      <!-- EMAIL INPUT -->
      <div class="input-group">
        <label for="usernameInput">Email</label>
        <input 
          type="email" 
          id="usernameInput" 
          placeholder="admin@school.com"
          autocomplete="email"
        >
      </div>

      <!-- PASSWORD INPUT -->
      <div class="input-group">
        <label for="passwordInput">Password</label>
        <input 
          type="password" 
          id="passwordInput" 
          placeholder="••••••••••"
          autocomplete="current-password"
        >
      </div>

      <!-- LOGIN BUTTON -->
      <button id="loginBtn">Login</button>

      <!-- ERROR MESSAGE -->
      <p id="loginError"></p>

      <!-- DEMO HINT (optional) -->
      <div class="demo-hint">
        <strong>📌 Demo Credentials</strong>
        Email: <code style="background:rgba(0,0,0,0.1); padding:2px 6px; border-radius:4px;">admin</code>
        <br>Password: <code style="background:rgba(0,0,0,0.1); padding:2px 6px; border-radius:4px;">admin123</code>
      </div>

      <!-- FOOTER HINT -->
      <p id="login-hint">Contact your administrator if you need access</p>

    </div>
  </div>

  <!-- RIGHT SIDE — GRADIENT BACKGROUND -->
  <div id="login-right">
    <div id="login-right-content">
      <h1>Welcome to<br>Student Manager</h1>
      <div id="login-divider"></div>
      <p>Manage Students, Teachers & Grades Efficiently</p>
    </div>
  </div>

  <!-- JAVASCRIPT -->
  <script type="module" src="./js/login.js"></script>

</body>
</html>
