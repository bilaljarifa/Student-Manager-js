<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <div id="toast-container"></div>
  <div id="header">
    <h1>Student Manager</h1>
    <button id="darkModeBtn"> Dark Mode</button>
  </div>
  <div id="dashboard">
    <div class="stat">
      <span>Total Students</span>
      <span id="counter">0</span>
    </div>
    <div class="stat">
      <span>Paid</span>
      <span id="paid">0</span>
    </div>
    <div class="stat">
      <span>Pending</span>
      <span id="pending">0</span>
    </div>
    <div class="stat">
      <span>Paid %</span>
      <span id="percentage">0%</span>
    </div>
    <div class="stat">
      <span>Pending %</span>
      <span id="pendingPercentage">0%</span>
    </div>
  </div>

  <!-- chart goes BELOW dashboard, not inside it -->
  <div id="chart-container">
    <canvas id="paymentChart"></canvas>
  </div>

  <div id="form-container">
    <select id="classFilter">
      <option value="">All Classes</option>
    </select>
    <select id="sortPayment">
      <option value="">Sort by Payment</option>
      <option value="Paid">Paid First</option>
      <option value="Pending">Pending First</option>
    </select>
    <button id="sortBtn">Sort by Name</button>
    <button id="clearAllBtn">Clear All</button>
    <button id="exportBtn">Export CSV</button>

    <input type="text" id="search" placeholder="Search students...">

    <input type="text" id="name" placeholder="Student Name">
    <input type="email" id="email" placeholder="Student Email">
    <input type="text" id="studentClass" placeholder="Class">

    <select id="paymentStatus">
      <option value="Paid">Paid</option>
      <option value="Pending">Pending</option>
    </select>

    <button id="addBtn">Add Student</button>
  </div>

  <div id="students"></div>

  <div id="pagination">
    <button id="prevBtn">← Previous</button>
    <span id="pageInfo">Page 1</span>
    <button id="nextBtn">Next →</button>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>

</html>
